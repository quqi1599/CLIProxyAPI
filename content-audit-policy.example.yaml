# Copy this file to content-audit-policy.yaml and replace the synthetic test terms
# with the reviewed keyword library. Keep rule identifiers stable across revisions.
version: "1"
global-allowlist: []
rules:
  - id: "synthetic-high-risk-action"
    category: "cyber_abuse"
    severity: "high"
    # Optional: require this many distinct keywords from the same rule.
    min-keyword-matches: 1
    keywords:
      - "synthetic prohibited action"
      - "敏感测试短语"
    allowlist:
      - "synthetic prohibited action false-positive fixture"
