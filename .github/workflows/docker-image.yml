name: docker-image

on:
  push:
    tags: ["fork/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Trusted release tag or full commit SHA with successful trusted-ci"
        required: true
      publish_latest:
        description: "Also update the compatibility latest tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cliproxy-image-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, ci-vps]
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Validate trusted reference
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_REF" =~ ^fork/v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve immutable candidate
        id: candidate
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${commit:0:12}"
          version="${RELEASE_REF#fork/}"
          if [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then version="sha-${commit:0:12}"; fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require successful tests for this exact candidate
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'trusted-ci.yml',
              head_sha: process.env.CANDIDATE_SHA, status: 'success', per_page: 100
            });
            const trusted = data.workflow_runs.some(run =>
              run.head_sha === process.env.CANDIDATE_SHA &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.head_repository?.full_name === context.repo.owner + '/' + context.repo.repo);
            if (!trusted) core.setFailed('No successful trusted-ci for this exact SHA');

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resource gate, build and publish immutable amd64 image
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          COMMIT: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.candidate.outputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest || false }}
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          command -v flock
          docker info --format '{{.Architecture}}'
          exec 9>/tmp/ci-heavy-docker-build.lock
          flock -w 1800 9
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          df -h "$docker_root" "$GITHUB_WORKSPACE"
          df -i "$docker_root" "$GITHUB_WORKSPACE"
          for path in "$docker_root" "$GITHUB_WORKSPACE"; do
            used="$(df -P "$path" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            inodes="$(df -Pi "$path" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            (( used <= 85 && inodes <= 85 )) || { echo 'Resource gate failed'; exit 1; }
          done
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            docker pull "$IMAGE"
            test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          else
            docker build --platform linux/amd64 \
              --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --tag "$IMAGE" .
            docker push "$IMAGE"
          fi
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          if [[ "$RELEASE_REF" == fork/v* ]]; then
            semver="${VERSION#v}"
            for alias in "${RELEASE_REF//\//-}" "$VERSION" "$semver" "${semver%.*}" "${semver%%.*}"; do
              docker tag "$IMAGE" "${IMAGE%:*}:$alias"
              docker push "${IMAGE%:*}:$alias"
            done
          fi
          if [[ "$PUBLISH_LATEST" = true ]]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
          fi
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
